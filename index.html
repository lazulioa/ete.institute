<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETERNAL TERRA EAR | ÉTÈ INSTITUTE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --fluorescent-purple: #bf00ff; 
            /* White overexposure glow */
            --overexposure: rgba(255, 255, 255, 0.95);
            --outer-glow: rgba(191, 0, 255, 0.4);
            --mono: 'JetBrains Mono', monospace;
            --serif: 'Times New Roman', Times, serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--serif);
            margin: 0;
            padding: 0 0 3rem 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* NAV WITH CENTRAL LOGO */
        nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 2rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .logo-container img {
            height: 60px;
            width: auto;
            /* White glow around logo */
            filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #fff);
        }

        header {
            padding: 6rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 5rem);
            line-height: 0.85;
            margin: 0 auto;
            max-width: 1200px;
            font-weight: normal;
            letter-spacing: -0.04em;
        }

        /* OVEREXPOSED PURPLE BAR (No black borders) */
        .meta-bar {
            font-family: var(--mono);
            font-size: 0.75rem;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: center;
            gap: 4rem;
            text-transform: uppercase;
            background-color: var(--fluorescent-purple);
            color: #ffffff;
            font-weight: bold;
            position: relative;
            
            /* The "Overexposure" Effect: White glow bleeding out from the edges */
            box-shadow: 0 0 25px 10px #fff, 0 0 40px 5px var(--outer-glow);
            border: none; /* Removed black lines */
            z-index: 5;
        }

        .content-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-top: 4rem;
        }

        .left-panel, .right-panel { padding: 4rem 2rem; }

        .section-label {
            font-family: var(--mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 3rem;
            font-weight: bold;
            color: var(--fluorescent-purple);
        }

        .data-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            padding: 1.5rem 0;
            border-top: 0.2px solid rgba(0,0,0,0.1); /* Very faint line instead of black */
        }

        .data-row .title { font-weight: bold; text-transform: uppercase; font-size: 1.1rem; }
        .data-row .desc { font-size: 0.95rem; line-height: 1.4; margin-top: 5px; opacity: 0.8; }

        /* FLOW CONTAINER (Real colors, soft edges) */
        .flow-container {
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            gap: 3rem;
            padding: 6rem 2rem;
            scrollbar-width: none; /* Clean look */
        }

        .flow-container::-webkit-scrollbar { display: none; }

        .flow-item {
            min-width: 500px;
            flex-shrink: 0;
        }

        .flow-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); /* Soft lift */
        }

        .flow-item p {
            margin: 0;
            padding: 1rem 1.5rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            background: var(--fluorescent-purple);
            color: #ffffff;
            text-transform: uppercase;
            font-weight: bold;
            /* Overexposure for image caption */
            box-shadow: 0 0 20px 5px #fff;
            position: relative;
            margin-top: -20px;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            padding: 8rem 2rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            opacity: 0.6;
        }

        /* TICKER (Darker contrast) */
        .ticker-wrap {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 3rem;
            background-color: var(--text);
            color: #fff;
            display: flex;
            align-items: center;
