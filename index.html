    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --dim: #777777;
            --mono: 'JetBrains Mono', monospace;
            --serif: 'Times New Roman', Times, serif;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--serif);
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000; border-bottom: 1px solid #000;
        }

        .logo-box img { height: 32px; display: block; }
        .nav-text { font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }

        #canvas-container { 
            width: 100vw; 
            height: 75vh; 
            background: #ffffff; 
            margin-top: 3rem; 
            cursor: crosshair; 
            position: relative; 
            border-bottom: 1px solid #000;
        }

        #node-label { 
            position: absolute; 
            pointer-events: none; 
            font-family: var(--mono); 
            color: #fff; 
            text-transform: uppercase; 
            font-size: 0.6rem; 
            background: #000; 
            padding: 4px 10px; 
            z-index: 2000; 
            display: none; 
        }

        .directory { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-bottom: 1px solid #000; background: #fff; }

        .directory-item span { display: block; font-size: 0.5rem; opacity: 0.6; margin-bottom: 0.5rem; }
        .directory-item strong { display: block; font-size: 0.75rem; text-transform: uppercase; }
