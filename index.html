<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÉTÈ Institute — Counter-Ontologies</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #030303; 
            font-family: 'Courier New', monospace; 
            color: #ffffff; 
            user-select: none;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* Tactical HUD Overlay Interface */
        #interface-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            pointer-events: none; 
            padding: 24px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        
        .header { 
            pointer-events: auto; 
            background: rgba(3, 3, 3, 0.9); 
            padding: 20px; 
            border-left: 2px solid #00ffcc; 
            max-width: 480px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            border-radius: 0 4px 4px 0;
        }
        .header h3 { margin: 0 0 6px 0; font-size: 15px; letter-spacing: 3px; color: #00ffcc; font-weight: bold; }
        .header p { margin: 0; font-size: 11px; color: #999; line-height: 1.5; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Strategic Global Team Roster Container */
        .team-container {
            pointer-events: auto;
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(3, 3, 3, 0.95);
            border: 1px solid #1a1a1a;
            padding: 16px;
            border-radius: 4px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            max-width: 360px;
        }
        .team-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            margin-bottom: 12px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 6px;
            font-weight: bold;
        }
        .team-grid { 
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }
        .team-member { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            font-size: 9px; 
        }
        .team-avatar { 
            width: 60px; 
            height: 60px; 
            border-radius: 2px; 
            border: 1px solid #222; 
            object-fit: cover; 
            margin-bottom: 6px; 
            filter: grayscale(100%) contrast(110%); 
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .team-member:hover .team-avatar { 
            filter: grayscale(0%) contrast(100%); 
            border-color: #00ffcc;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.2);
        }
        .team-member span { color: #888; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

        /* Structural Stream Pipeline Container (Kept off-screen) */
        #video-pipeline { display: none; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="interface-layer">
        <div class="header">
            <h3>ÉTÈ INSTITUTE // COUNTER-ONTOLOGIES</h3>
            <p>Geometrical Composition Framework & Civil Auditing Infrastructure Layer<br>Mapping Automated Post-Humanitarian Systems</p>
        </div>

        <div class="team-container">
            <div class="team-title">Active Research Manifest</div>
            <div class="team-grid">
                <div class="team-member">
                    <img src="assets/team/yidi.jpg" class="team-avatar" alt="Yidi Lola Wang">
                    <span>Yidi</span>
                </div>
                <div class="team-member">
                    <img src="assets/team/fatemeh.jpg" class="team-avatar" alt="Fatemeh Kazemi">
                    <span>Fatemeh</span>
                </div>
                <div class="team-member">
                    <img src="assets/team/francesco.jpg" class="team-avatar" alt="Francesco">
                    <span>Francesco</span>
                </div>
                <div class="team-member">
                    <img src="assets/team/joaquina.jpg" class="team-avatar" alt="Joaquina">
                    <span>Joaquina</span>
                </div>
            </div>
        </div>
    </div>

    <div id="video-pipeline">
        <video id="telemetry-video-feed" src="assets/videos/telemetry_composition.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    </div>

    <script>
        // 1. Core Environmental Architecture Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030303);
        scene.fog = new THREE.FogExp2(0x030303, 0.015);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(28, 18, 38);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.03; // Keeps camera above the baseline coordinate grid

        // 2. Video Pipeline Stream Extraction
        const video = document.getElementById('telemetry-video-feed');
        
        // Browser safety catch to force execution upon initial user touch interaction
        document.body.addEventListener('click', () => {
            if (video.paused) video.play();
        }, { once: true });

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.generateMipmaps = false;

        // 3. Compiling Joaquina's Parametric Geometrical Composition Layers
        const geoCompositionGroup = new THREE.Group();

        // Texture skin map running the live telemetry video
        const structuralVideoMaterial = new THREE.MeshBasicMaterial({ 
            map: videoTexture, 
            side: THREE.DoubleSide
        });

        // Overlay Wireframe capturing structural sovereignty metrics
        const geometricWireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });

        // Joaquina's Original Geometry Specification: Extruded Parametric Composition Base
        const originalBaseGeometry = new THREE.CylinderGeometry(14, 20, 18, 5, 5, true);
        
        const videoMeshNode = new THREE.Mesh(originalBaseGeometry, structuralVideoMaterial);
        const wireframeMeshNode = new THREE.Mesh(originalBaseGeometry, geometricWireframeMaterial);
        
        geoCompositionGroup.add(videoMeshNode);
        geoCompositionGroup.add(wireframeMeshNode);
        scene.add(geoCompositionGroup);

        // Geometrical Reference Alignment Grid
        const structuralSpatialGrid = new THREE.GridHelper(90, 45, 0x00ffcc, 0x111111);
        structuralSpatialGrid.position.y = -9;
        scene.add(structuralSpatialGrid);

        // 4. Analytical Operational Animation Loop
        const systemClock = new THREE.Clock();

        function pipelineEngine() {
            requestAnimationFrame(pipelineEngine);
            
            const timeDelta = systemClock.getElapsedTime();
            
            // Continuous rotational movement tracking
            geoCompositionGroup.rotation.y = timeDelta * 0.035;
            
            // Subtle vertical fluctuation calculating stochastic drift tracking
            geoCompositionGroup.position.y = Math.sin(timeDelta * 0.4) * 0.25;

            controls.update();
            renderer.render(scene, camera);
        }

        // Real-Time Viewport Scale Reconfiguration
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        pipelineEngine();
    </script>
</body>
</html>
